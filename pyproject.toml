[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onestepfold"
version = "0.1.0"
description = "Open MSA-off one-step all-heavy-atom multi-chain protein folding experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OneStepFold research team" }]
dependencies = []

[project.optional-dependencies]
data = ["numpy>=2.0", "gemmi>=0.7"]
ml = ["numpy>=2.0", "torch>=2.3"]
esmc = [
  "numpy>=2.0",
  "torch>=2.11,<2.12",
  "safetensors>=0.4",
  "esm @ git+https://github.com/Biohub/esm.git@bf343ba264b650dff7a073643725f9aaa1fdbe8d",
]
split = ["biopython>=1.86"]
glycoshape = ["glycontact>=0.3.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "biopython>=1.86", "scikit-learn>=1.4"]

[project.scripts]
fastglycan = "fastglycan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastglycan", "src/onestepfold"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
