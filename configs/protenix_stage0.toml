# Stage 0 is an inference-only quality/cost matrix on the same checkpoint.
# The command runner must pass --use_default_params false so these overrides win.

[protocol]
model_name = "protenix_mini_esm_v0.5.0"
# The v0.5.0 checkpoint is loaded through the modern v1.1.0 CLI.  Keep the
# runtime package version separate from the model name above.
protenix_package = "protenix==1.1.0"
protenix_revision = "pypi-wheel-sha256:074fa0395c9cd980257a868f55fc9ccd0d432440e3f56a8bbdf234d21bcb388e"
checkpoint_sha256 = "1301bba9ad322518eace60fd244ded7904439f55317e90d402cc7a0c06026664"
use_msa = false
use_template = false
dtype = "bf16"
tf32 = false
kernel_backend = "fixed-and-recorded-before-run"
sample = 1
seed = 101
variance_seeds = [101, 103, 107, 109, 113]
training_cutoff = "2021-09-30"
max_length = 1024
temporal_dev_groups = 1024
variance_subset_groups = 128
temporal_dev_manifest = "temporal_dev_v1.jsonl.gz"
frozen_temporal_test_manifest = "frozen_temporal_test_v1.jsonl.gz"
anchor = "c4_s5"
component_timing_status = "requires-Protenix-internal-hooks"

[[sweep]]
name = "c1_s1"
cycles = 1
steps = 1

[[sweep]]
name = "c1_s2"
cycles = 1
steps = 2

[[sweep]]
name = "c1_s5"
cycles = 1
steps = 5

[[sweep]]
name = "c2_s1"
cycles = 2
steps = 1

[[sweep]]
name = "c2_s2"
cycles = 2
steps = 2

[[sweep]]
name = "c2_s5"
cycles = 2
steps = 5

[[sweep]]
name = "c4_s1"
cycles = 4
steps = 1

[[sweep]]
name = "c4_s2"
cycles = 4
steps = 2

[[sweep]]
name = "c4_s5"
cycles = 4
steps = 5

[evaluation]
metrics = [
  "tm_score",
  "lddt_ca",
  "lddt_all_atom",
  "gdt_ts",
  "backbone_rmsd",
  "sidechain_rmsd",
  "bond_length_violations",
  "bond_angle_violations",
  "steric_clash_rate",
  "ramachandran_outlier_rate",
  "chirality_violations",
]
length_bins = ["20-127", "128-255", "256-511", "512-768", "769-1024"]
